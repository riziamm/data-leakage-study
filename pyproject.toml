[project]
name = "mie27"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "joblib"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
